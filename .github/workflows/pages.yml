name: Publicera glosappen

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * *"   # dagligen 16:00 svensk sommartid (15:00 vintertid): hämta nya övningar från glosor.eu
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Gör om alla olåsta meningar (nya varianter). Ändrat tema i en CSV görs om automatiskt ändå."
        type: boolean
        default: false

permissions:
  contents: write    # för att committa tillbaka genererade meningar
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main        # senaste main, inte commiten som startade körningen – en köad körning ska se botens commits
          fetch-depth: 0   # behövs för att läsa datum per glosfil ur git-historiken

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hämta nya övningar från glosor.eu
        continue-on-error: true   # om glosor.eu krånglar publiceras appen ändå
        env:
          GLOSOR_EU_USER: ${{ secrets.GLOSOR_EU_USER }}
          GLOSOR_EU_PASS: ${{ secrets.GLOSOR_EU_PASS }}
        run: python scripts/fetch_glosor.py

      - name: Generera exempelmeningar med Gemini
        id: sentences
        continue-on-error: true   # om Gemini krånglar publiceras appen ändå, utan nya meningar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_sentences.py ${{ inputs.regenerate && '--regenerate' || '' }}

      - name: Committa nya glosor och meningar till repot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glosor/*.csv glosor/*.sentences.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Inga nya glosor eller meningar att committa"
          else
            if git diff --cached --name-only --diff-filter=A | grep -q '\.csv$'; then
              msg="Hämtade glosor från glosor.eu och genererade meningar [skip ci]"
            else
              msg="Genererade exempelmeningar [skip ci]"
            fi
            git commit -m "$msg"
            if git pull --rebase --autostash && git push; then
              echo "Pushade: $msg"
            else
              # main ändrades under körningen (t.ex. en annan körning hann före) – släpp vår commit,
              # publicera senaste main; det som saknas tas vid nästa körning
              git rebase --abort 2>/dev/null || true
              git fetch origin main
              git reset --hard origin/main
              echo "::warning::Kunde inte pusha (main ändrades under körningen) – publicerar senaste main"
            fi
          fi

      - name: Bygg glosor/index.json
        run: python scripts/build_index.py

      - name: Samla ihop sajten
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest icon.svg icon-192.png icon-512.png _site/
          cp -r glosor _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
